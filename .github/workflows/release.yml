# Build & Release APK workflow
# 已添加：job-level 环境变量清理 + checkout 后的 Sanitize 步骤，防止 JAVA_TOOL_OPTIONS/_JAVA_OPTIONS/GRADLE_OPTS 被错误注入
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: '本次更新说明'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    # 在 job 层级显式清空，防止任何步骤继承到错误的值
    env:
      JAVA_TOOL_OPTIONS: ''
      _JAVA_OPTIONS: ''
      GRADLE_OPTS: ''

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanitize Java/Gradle env vars (防止错误的 JVM 参数被注入)
        run: |
          # 立即清除可能由 runner 或上游步骤注入的 JVM/Gradle 参数
          unset JAVA_TOOL_OPTIONS || true
          unset _JAVA_OPTIONS || true
          unset GRADLE_OPTS || true
          export JAVA_TOOL_OPTIONS=""
          export _JAVA_OPTIONS=""
          export GRADLE_OPTS=""
          # 打印以便排查不可见字符或多余引号（例如 0x22 是双引号）
          echo "JAVA_TOOL_OPTIONS=[${JAVA_TOOL_OPTIONS}]"
          echo "_JAVA_OPTIONS=[${_JAVA_OPTIONS}]"
          echo "GRADLE_OPTS=[${GRADLE_OPTS}]"
          printf '%s' "${_JAVA_OPTIONS}" | od -An -t x1 || true
          printf '%s' "${JAVA_TOOL_OPTIONS}" | od -An -t x1 || true
        shell: bash

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 注入签名配置到 local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "RELEASE_STORE_FILE=${{ github.workspace }}/keystore.jks" >> local.properties
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> local.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> local.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> local.properties

      - name: 解码签名文件
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: 获取版本号（设备日期）
        id: version
        run: |
          # 使用 UTC+8 日期作为版本号前缀
          DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)
          # 查询 GitHub 当天已有的 release 数量来确定迭代序号
          EXISTING=$(gh release list --limit 100 --json tagName --jq ".[].tagName" | grep "^v${DATE}" | wc -l)
          ITER=$(printf "%02d" $((EXISTING + 1)))
          VERSION="${DATE}${ITER}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "版本号: ${VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 更新 build.gradle.kts 版本号
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/versionCode[[:space:]]*=[[:space:]]*[0-9]*/versionCode = ${VERSION}/" app/build.gradle.kts
          sed -i "s/versionName[[:space:]]*=[[:space:]]*\"[^\"]*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          echo "已更新版本号为: ${VERSION}"
          grep -E "versionCode|versionName" app/build.gradle.kts || true

      # Debug step: print any Java/Gradle-related env vars so we can see what's被注入
      - name: 打印 Java / Gradle 环境变量（调试）
        run: |
          echo "==== Java/Gradle related env vars ===="
          env | grep -E 'GRADLE_OPTS|JAVA_TOOL_OPTIONS|_JAVA_OPTIONS' || true
          echo "======================================"
        shell: bash

      - name: 构建 Release APK
        run: |
          # 打印原始变量以便调试（如果有引用或不可见字符可以看到）
          echo "==== BEFORE CLEANUP Java/Gradle env vars ===="
          echo "JAVA_TOOL_OPTIONS=[${JAVA_TOOL_OPTIONS}]"
          echo "_JAVA_OPTIONS=[${_JAVA_OPTIONS}]"
          echo "GRADLE_OPTS=[${GRADLE_OPTS}]"
          printf '%s' "${_JAVA_OPTIONS}" | od -An -t x1 || true
          printf '%s' "${JAVA_TOOL_OPTIONS}" | od -An -t x1 || true
          echo "============================================="

          # 再次确保在当前 shell 里取消可能来自 runner 或其他地方的带引号的 JVM/Gradle 参数
          unset JAVA_TOOL_OPTIONS || true
          unset _JAVA_OPTIONS || true
          unset GRADLE_OPTS || true
          export JAVA_TOOL_OPTIONS=""
          export _JAVA_OPTIONS=""
          export GRADLE_OPTS=""

          chmod +x ./gradlew

          # 使用 env -u 在命令级别移除这些变量，确保 gradle/Java 不会收到错误的 JVM 参数
          env -u JAVA_TOOL_OPTIONS -u _JAVA_OPTIONS -u GRADLE_OPTS ./gradlew assembleRelease --no-daemon --no-build-cache
        env:
          # 冗余但更安全：显式在此步骤层面保持为空
          GRADLE_OPTS: ''
          JAVA_TOOL_OPTIONS: ''
          _JAVA_OPTIONS: ''
        shell: bash

      - name: 重命名 APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mv app/build/outputs/apk/release/app-release.apk "paibanrili-v${VERSION}.apk"
          echo "APK_PATH=paibanrili-v${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION_TAG=v${VERSION}" >> $GITHUB_ENV

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.VERSION_TAG }}
          body: |
            ${{ inputs.release_notes != '' && inputs.release_notes || '排班日历 Release' }}
            
            版本号: ${{ env.VERSION_TAG }}
            构建时间: ${{ github.run_id }}
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
