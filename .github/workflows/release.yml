name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: '本次更新说明'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 注入签名配置到 local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "RELEASE_STORE_FILE=${{ github.workspace }}/keystore.jks" >> local.properties
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> local.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> local.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> local.properties

      - name: 解码签名文件
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: 获取版本号（设备日期）
        id: version
        run: |
          # 使用 UTC+8 日期作为版本号前缀
          DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)
          # 查询 GitHub 当天已有的 release 数量来确定迭代序号
          EXISTING=$(gh release list --limit 100 --json tagName --jq ".[].tagName" | grep "^v${DATE}" | wc -l)
          ITER=$(printf "%02d" $((EXISTING + 1)))
          VERSION="${DATE}${ITER}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "版本号: ${VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 更新 build.gradle.kts 版本号
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/versionCode   = [0-9]*/versionCode   = ${VERSION}/" app/build.gradle.kts
          sed -i "s/versionName   = \"[^\"]*\"/versionName   = \"${VERSION}\"/" app/build.gradle.kts
          echo "已更新版本号为: ${VERSION}"
          cat app/build.gradle.kts | grep -E "versionCode|versionName"

      - name: 构建 Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 重命名 APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mv app/build/outputs/apk/release/app-release.apk "paibanrili-v${VERSION}.apk"
          echo "APK_PATH=paibanrili-v${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION_TAG=v${VERSION}" >> $GITHUB_ENV

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.VERSION_TAG }}
          body: |
            ${{ inputs.release_notes != '' && inputs.release_notes || '排班日历 Release' }}
            
            版本号: ${{ env.VERSION_TAG }}
            构建时间: ${{ github.run_id }}
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
