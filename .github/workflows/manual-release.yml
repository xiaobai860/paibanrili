# 手动触发并自动发布的 Release 工作流
# 说明：
# - 在 Actions 界面手动运行（workflow_dispatch），填写 release_tag、release_name、release_body、publish
# - 会尝试用 Gradle 构建（如果 repo 有 gradlew / Android 输出），并把输出打包成 release-artifacts.zip
# - 使用 ncipollo/release-action 创建并上传 Release（使用 GITHUB_TOKEN）
permissions:
  contents: write

name: Manual Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
      release_name:
        description: 'Release name (optional)'
        required: false
        default: ''
      release_body:
        description: 'Release notes (optional)'
        required: false
        default: ''
      publish:
        description: 'Publish the release? Set to "true" to publish immediately, "false" to create a draft.'
        required: false
        default: 'true'

jobs:
  build:
    name: Build (Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable (if present)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Run Gradle build (assembleRelease if available)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleRelease --no-daemon || ./gradlew clean build --no-daemon
          else
            echo "No gradlew found, skipping Gradle build"
          fi

      - name: Collect build outputs into zip
        run: |
          rm -f release-artifacts.zip || true
          # Prefer Android outputs if they exist
          if [ -d "app/build/outputs" ]; then
            zip -r release-artifacts.zip app/build/outputs || true
          else
            # Fallback: zip the repo (useful if there's no Android project)
            zip -r release-artifacts.zip . || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts.zip

  release:
    name: Create and publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: .

      - name: Create GitHub Release and upload artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_name }}
          body: ${{ github.event.inputs.release_body }}
          # If publish input is not exactly the string 'true', create as draft; otherwise publish immediately
          draft: ${{ github.event.inputs.publish != 'true' }}
          files: release-artifacts.zip
