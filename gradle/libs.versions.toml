[versions]
agp                  = "8.13.0"
kotlin               = "2.0.21"
ksp                  = "2.0.21-1.0.28"
hilt                 = "2.52"
compose-bom          = "2025.05.01"
navigation-compose   = "2.8.9"
room                 = "2.7.1"
datastore            = "1.1.4"
lifecycle            = "2.9.1"
activity-compose     = "1.10.1"
core-ktx             = "1.16.0"
appcompat            = "1.7.0"
coroutines           = "1.9.0"
gson                 = "2.11.0"
glance               = "1.1.1"

# 农历计算库（tyme4j 是 lunar 的升级版）
tyme4j               = "1.5.1"

[libraries]
# Android core
core-ktx                = { group = "androidx.core",               name = "core-ktx",                     version.ref = "core-ktx" }
appcompat               = { group = "androidx.appcompat",          name = "appcompat",                    version.ref = "appcompat" }
activity-compose        = { group = "androidx.activity",           name = "activity-compose",             version.ref = "activity-compose" }

# Compose BOM
compose-bom             = { group = "androidx.compose",            name = "compose-bom",                  version.ref = "compose-bom" }
compose-ui              = { group = "androidx.compose.ui",         name = "ui" }
compose-runtime         = { group = "androidx.compose.runtime",     name = "runtime" }
compose-ui-tooling      = { group = "androidx.compose.ui",         name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui",     name = "ui-tooling-preview" }
compose-ui-graphics     = { group = "androidx.compose.ui",         name = "ui-graphics" }
compose-foundation      = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3       = { group = "androidx.compose.material3",  name = "material3" }
compose-material-icons  = { group = "androidx.compose.material",   name = "material-icons-extended" }

# Navigation
navigation-compose      = { group = "androidx.navigation",         name = "navigation-compose",           version.ref = "navigation-compose" }

# Lifecycle / ViewModel
lifecycle-viewmodel-compose    = { group = "androidx.lifecycle",  name = "lifecycle-viewmodel-compose",    version.ref = "lifecycle" }
lifecycle-runtime-ktx         = { group = "androidx.lifecycle",  name = "lifecycle-runtime-ktx",           version.ref = "lifecycle" }
lifecycle-runtime-compose     = { group = "androidx.lifecycle",  name = "lifecycle-runtime-compose",       version.ref = "lifecycle" }

# Room
room-runtime            = { group = "androidx.room",               name = "room-runtime",                 version.ref = "room" }
room-ktx                = { group = "androidx.room",               name = "room-ktx",                     version.ref = "room" }
room-compiler           = { group = "androidx.room",               name = "room-compiler",                version.ref = "room" }

# DataStore
datastore-prefs         = { group = "androidx.datastore",          name = "datastore-preferences",        version.ref = "datastore" }

# Hilt
hilt-android            = { group = "com.google.dagger",           name = "hilt-android",                 version.ref = "hilt" }
hilt-compiler           = { group = "com.google.dagger",           name = "hilt-android-compiler",        version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt",               name = "hilt-navigation-compose",      version = "1.2.0" }

# Coroutines
coroutines-android      = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android",   version.ref = "coroutines" }

# Gson
gson                    = { group = "com.google.code.gson",         name = "gson",                         version.ref = "gson" }

# kotlinx-serialization（Navigation 2.8 类型安全路由）
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json",  version = "1.7.3" }

# Glance（桌面小组件 Compose-first）
glance-appwidget        = { group = "androidx.glance",              name = "glance-appwidget",             version.ref = "glance" }
glance-material3        = { group = "androidx.glance",              name = "glance-material3",             version.ref = "glance" }

# 农历计算库（tyme4j 是 lunar 的升级版）
tyme4j                  = { group = "cn.6tail",                    name = "tyme4j",                       version.ref = "tyme4j" }

[plugins]
android-application     = { id = "com.android.application",        version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",   version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                    = { id = "com.google.dagger.hilt.android",  version.ref = "hilt" }
ksp                     = { id = "com.google.devtools.ksp",         version.ref = "ksp" }
